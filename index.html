<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pattern Dojo</title>
<style>
:root{
  --bg:#0f1220; --card:#181c30; --card2:#20254080; --line:#2c3252; --text:#e8ebff; --muted:#9aa2c8;
  --accent:#7c8cff; --good:#3ecf8e; --bad:#ff6b7a; --warn:#ffc857; --btn:#262c4d; --btnh:#313963;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f4f5fb; --card:#ffffff; --card2:#eef0fa; --line:#d9dcef; --text:#1c2040; --muted:#5d6590;
    --accent:#4254e8; --good:#14925d; --bad:#d63a4e; --warn:#b97a00; --btn:#eceffc; --btnh:#dde2fa;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:28px;margin:8px 0 4px}
h2{font-size:20px;margin:0 0 8px}
p{margin:6px 0}
.muted{color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
button{font:inherit;color:inherit;background:var(--btn);border:1px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer;text-align:left}
button:hover:not(:disabled){background:var(--btnh)}
button:disabled{cursor:default;opacity:.85}
button.primary{background:var(--accent);color:#fff;border-color:transparent;text-align:center;font-weight:600}
button.primary:hover:not(:disabled){filter:brightness(1.1);background:var(--accent)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>button{flex:1 1 200px}
.hud{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px}
.hud b{font-variant-numeric:tabular-nums}
.dots{display:flex;gap:4px;margin:8px 0}
.dots i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.dots i.done{background:var(--good)} .dots i.now{background:var(--accent)} .dots i.miss{background:var(--warn)}
.phase{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:700}
.story{font-size:18px;line-height:1.9}
.tok{border-radius:6px;padding:2px 3px;cursor:pointer;border-bottom:2px dashed var(--line)}
.tok:hover{background:var(--card2)}
.tok.sel{background:var(--accent);color:#fff;border-bottom-color:transparent}
.tok.good{background:var(--good);color:#06281a;border-bottom-color:transparent}
.tok.bad{background:var(--bad);color:#fff;border-bottom-color:transparent}
.tok.miss{outline:2px solid var(--warn);outline-offset:1px;border-bottom-color:transparent}
.tok.locked{cursor:default}
.opts{display:grid;gap:10px;margin-top:10px}
.opt{display:flex;gap:10px;align-items:flex-start}
.opt.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 22%,var(--card))}
.opt.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 18%,var(--card));text-decoration:line-through;opacity:.7}
.fb{border-left:4px solid var(--line);padding:8px 12px;margin-top:12px;background:var(--card2);border-radius:0 10px 10px 0}
.fb.good{border-left-color:var(--good)} .fb.bad{border-left-color:var(--bad)} .fb.warn{border-left-color:var(--warn)}
.steps{display:grid;gap:8px;margin-top:8px}
.step{display:flex;gap:10px;align-items:flex-start}
.step .n{min-width:26px;height:26px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-size:13px;font-weight:700}
.step.ok{border-color:var(--good)} .step.ok .n{background:var(--good);color:#06281a}
.step.no{border-color:var(--bad)} .step.no .n{background:var(--bad);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.pat{padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.pat b{display:block}
.bar{height:6px;border-radius:3px;background:var(--line);margin-top:8px;overflow:hidden}
.bar>span{display:block;height:100%;background:var(--good)}
.tag{font-size:12px;color:var(--muted)}
.big{font-size:40px;font-weight:800}
kbd{background:var(--btn);border:1px solid var(--line);border-radius:5px;padding:0 5px;font-size:13px}
</style>
</head>
<body>
<main id="app"></main>
<script>
/* ---------- Content ---------- */
const PATTERNS = {
  hash:     {name:"Hash Map / Set",        icon:"🗂️", cue:"You need to remember what you've seen and look it up instantly."},
  twoptr:   {name:"Two Pointers",          icon:"👉👈", cue:"Sorted data, a pair or a pair-like condition, and tight memory."},
  window:   {name:"Sliding Window",        icon:"🪟", cue:"A contiguous stretch that grows on one end and shrinks on the other."},
  bsearch:  {name:"Binary Search",         icon:"✂️", cue:"A yes/no answer that flips exactly once across a huge ordered range."},
  bfs:      {name:"BFS",                   icon:"🌊", cue:"Fewest steps when every step costs the same."},
  dfs:      {name:"DFS / Flood Fill",      icon:"🕳️", cue:"Explore everything connected to a starting point."},
  stack:    {name:"Stack",                 icon:"📚", cue:"Last in, first out: the most recent thing is dealt with first."},
  heap:     {name:"Heap",                  icon:"⛰️", cue:"Repeatedly need the smallest or largest of a changing set."},
  dp:       {name:"Dynamic Programming",   icon:"🧱", cue:"Best answer builds on best answers of smaller versions, which repeat."},
  greedy:   {name:"Greedy",                icon:"🎯", cue:"One locally best choice that provably never hurts later."},
  uf:       {name:"Union-Find",            icon:"🔗", cue:"Groups that keep merging, with 'same group?' queries."},
  backtrack:{name:"Backtracking",          icon:"↩️", cue:"Enumerate all arrangements: choose, explore, undo."},
  topo:     {name:"Topological Sort",      icon:"📋", cue:"Dependencies decide the order; a cycle means impossible."},
  trie:     {name:"Trie",                  icon:"🌳", cue:"Many strings queried by prefix."},
  prefix:   {name:"Prefix Sums",           icon:"➕", cue:"Many range-total queries over data that doesn't change."},
  fastslow: {name:"Fast & Slow Pointers",  icon:"🐢🐇", cue:"Cycle or midpoint in a linked structure with no extra memory."},
  dijkstra: {name:"Dijkstra",              icon:"🗺️", cue:"Cheapest route when edges have different non-negative costs."}
};

/* Markup: [[signal]] = phrase that points to the pattern, ((noise)) = story detail that doesn't matter. */
const PROBLEMS = [
 {id:"two-sum", pattern:"hash", title:"Matching Prices",
  text:"A shopkeeper named ((Ravi)) has an [[unsorted]] list of 100,000 prices. He wants [[two prices that add up to a target]], and for each price he'd like to [[check instantly whether its partner was already seen]].",
  options:["hash","twoptr","bsearch","dp"], trapFor:"twoptr",
  trap:"Two Pointers needs sorted data. Sorting costs O(n log n) and destroys the original positions.",
  why:"For each number, the partner is fully determined (target − x). 'Have I seen it?' is exactly what a hash table answers in O(1).",
  steps:["Walk through the prices one at a time","Work out the partner: target minus this price","Look the partner up in the table of prices seen so far","If it is there, return the pair and stop","If not, store this price in the table and move on"],
  cx:"O(n)", cxOpts:["O(n)","O(n log n)","O(n²)","O(log n)"], cxWhy:"One pass; each lookup/insert is O(1). Checking all pairs (O(n²)) would be 10 billion operations at n = 100,000."},

 {id:"pair-sorted", pattern:"twoptr", title:"Sorted Salaries",
  text:"A [[sorted]] array of 200,000 ((company)) salaries. Find [[two values that sum to a target]]. The platform allows only [[O(1) extra memory]].",
  options:["twoptr","hash","window","heap"], trapFor:"hash",
  trap:"A hash set works for correctness but uses O(n) extra memory, which the problem forbids.",
  why:"Sorted order tells you which pointer to move: sum too small → move left pointer up; too big → move right pointer down.",
  steps:["Place one marker at the smallest value and one at the largest","Add the two values under the markers","If the sum is too small, move the left marker right","If the sum is too large, move the right marker left","If the sum equals the target, return the pair"],
  cx:"O(n)", cxOpts:["O(n)","O(n log n)","O(n²)","O(1)"], cxWhy:"Each pointer only moves inward, so there are at most n moves total."},

 {id:"longest-unique", pattern:"window", title:"Clean Stretch",
  text:"A chat app logs a stream of characters from a user called ((Mira)). Find the [[longest contiguous stretch]] that has [[no repeated character]].",
  options:["window","dp","backtrack","bsearch"], trapFor:"dp",
  trap:"DP over all substrings is O(n²) work for something a moving frame can do in one pass.",
  why:"'Contiguous stretch + a rule that can be violated' is the sliding window signature: extend right, shrink left when the rule breaks.",
  steps:["Grow the window by taking the next character on the right","If that character is already in the window, shrink from the left until it is not","Record the window length if it is the longest so far","Repeat until the end of the stream"],
  cx:"O(n)", cxOpts:["O(n)","O(n²)","O(n log n)","O(2ⁿ)"], cxWhy:"Each character enters and leaves the window at most once."},

 {id:"first-bad", pattern:"bsearch", title:"First Bad Release",
  text:"There are 1,000,000,000 versions of an app. [[Every version after the first bad one is also bad]]. Each test run is ((slow and expensive)), so you want [[the fewest test runs]].",
  options:["bsearch","greedy","dp","window"], trapFor:"greedy",
  trap:"Testing versions one by one is the naive scan: up to a billion runs.",
  why:"'Good…good…BAD…bad…bad' is a monotonic yes/no. Each test can discard half of the remaining range.",
  steps:["Set the range to all versions, first to last","Test the middle version","If it is bad, the answer is at or before it: drop the right half","If it is good, the answer is after it: drop the left half","Stop when only one version remains in range"],
  cx:"O(log n)", cxOpts:["O(log n)","O(n)","O(n log n)","O(1)"], cxWhy:"log₂(10⁹) ≈ 30 test runs."},

 {id:"maze", pattern:"bfs", title:"Warehouse Robot",
  text:"A robot in a ((cheerful orange)) warehouse grid must reach the exit. [[Every move costs the same]]. Find the [[fewest moves]] through the grid.",
  options:["bfs","dfs","dijkstra","dp"], trapFor:"dfs",
  trap:"DFS finds *a* path, not the shortest. Dijkstra also works but is unnecessary machinery when all costs are equal.",
  why:"BFS explores in rings of equal distance, so the first time it reaches the exit is guaranteed to be the shortest.",
  steps:["Put the start cell in a queue and mark it visited","Take the oldest cell from the queue","If it is the exit, return its distance","Add every unvisited neighbour to the queue with distance + 1","Repeat until the queue is empty"],
  cx:"O(V + E)", cxOpts:["O(V + E)","O(V log V)","O(V!)","O(1)"], cxWhy:"Each cell is queued once and each edge examined once."},

 {id:"brackets", pattern:"stack", title:"Bracket Check",
  text:"Check whether a string such as ({[]}) is valid. The [[most recently opened bracket must be closed first]], and ((the string came from a text editor)).",
  options:["stack","hash","twoptr","dp"], trapFor:"twoptr",
  trap:"Two pointers from the ends fails on nesting like ()(): the matching partner isn't at the mirrored position.",
  why:"'Most recent first' is LIFO. The stack always holds the brackets still waiting to be closed.",
  steps:["Scan the string left to right","On an opening bracket, push it onto the stack","On a closing bracket, pop the top and check that it matches","If it mismatches or the stack is empty, the string is invalid","At the end the stack must be empty to be valid"],
  cx:"O(n)", cxOpts:["O(n)","O(n²)","O(log n)","O(n log n)"], cxWhy:"Each character is pushed and popped at most once."},

 {id:"top-k", pattern:"heap", title:"Live Leaderboard",
  text:"From a ((live game)) stream of 10 million scores, always report the [[k largest]] ones. Memory is limited to [[about k scores]] and [[new scores keep arriving]].",
  options:["heap","stack","bsearch","prefix"], trapFor:"bsearch",
  trap:"Sorting everything needs all 10 million scores in memory and re-sorting on each arrival.",
  why:"A size-k min-heap keeps the k largest; the smallest of them sits on top, ready to be evicted.",
  steps:["Keep a min-heap capped at size k","For each new score, push it into the heap","If the heap now has more than k items, pop the smallest","The heap now holds the k largest scores","The top of the heap is the k-th largest"],
  cx:"O(n log k)", cxOpts:["O(n log k)","O(n²)","O(n log n)","O(k²)"], cxWhy:"Each of n scores costs O(log k) to push/pop. Tighter than sorting (O(n log n)) because k is small."},

 {id:"coins", pattern:"dp", title:"Fewest Coins",
  text:"Given coin values, find the [[fewest coins]] to make an amount of 10,000. The best answer for an amount [[builds on best answers for smaller amounts]], and the same sub-amounts [[come up again and again]]. ((The coins are old British ones.))",
  options:["dp","greedy","bfs","backtrack"], trapFor:"greedy",
  trap:"Greedy 'take the biggest coin' breaks on {1,3,4} for 6: it picks 4+1+1 (3 coins) but 3+3 uses 2.",
  why:"Overlapping subproblems + optimal substructure = DP. Solve each smaller amount once and reuse it.",
  steps:["Define best[a] as the fewest coins for amount a, with best[0] = 0","Loop over every amount from 1 up to the target","For each amount, try every coin that fits","Update best[a] = min(best[a], best[a − coin] + 1)","The answer is best[target]"],
  cx:"O(A·C)", cxOpts:["O(A·C)","O(2^A)","O(A)","O(C)"], cxWhy:"A amounts × C coins. Brute force over coin combinations is exponential."},

 {id:"meetings", pattern:"greedy", title:"Packed Calendar",
  text:"Pick the [[maximum number of non-overlapping meetings]] from a list of start and end times for ((one conference room)). Choosing the [[meeting that frees the room earliest]] can be proven never to hurt.",
  options:["greedy","dp","backtrack","heap"], trapFor:"backtrack",
  trap:"Trying every subset of meetings is exponential. A provably safe local choice makes it unnecessary.",
  why:"Finishing earliest leaves the most room for the rest: the exchange argument proves it never loses.",
  steps:["Sort the meetings by end time","Take the first meeting","For each next meeting, check if it starts after the last chosen one ends","If yes, take it; if not, skip it","Count the meetings you took"],
  cx:"O(n log n)", cxOpts:["O(n log n)","O(n)","O(2ⁿ)","O(n²)"], cxWhy:"Dominated by the sort; the scan afterwards is O(n)."},

 {id:"friends", pattern:"uf", title:"Friend Circles",
  text:"Friendships are added one pair at a time. After each one, you must answer whether two people are in the [[same friend group]]. Groups [[keep merging]] as the ((social app)) grows.",
  options:["uf","bfs","dfs","hash"], trapFor:"bfs",
  trap:"BFS/DFS would re-scan the whole graph for every query. That is far too slow with millions of updates.",
  why:"Union-Find merges groups and checks membership in near-constant time.",
  steps:["Start with every person in their own group","For a new friendship, find the leader of each person's group","If the leaders differ, link one group under the other","To answer a query, compare the two leaders","While finding a leader, point nodes straight at it to speed up later lookups"],
  cx:"O(α(n)) per op", cxOpts:["O(α(n)) per op","O(n) per op","O(n²) per op","O(log² n) per op"], cxWhy:"With path compression and union by rank, α(n) is effectively constant (< 5 for any real input)."},

 {id:"perms", pattern:"backtrack", title:"All Arrangements",
  text:"List [[every possible arrangement]] of 8 distinct letters, ((for a puzzle app)). You build candidates [[one choice at a time and undo a choice]] to try the next.",
  options:["backtrack","dp","greedy","bsearch"], trapFor:"dp",
  trap:"DP needs overlapping subproblems with a single optimal value. Here you must output all arrangements.",
  why:"'Enumerate everything' + 'build step by step' = choose, explore, un-choose.",
  steps:["Pick an unused letter and append it to the current arrangement","Recurse to fill the next position","If the arrangement is full, record it","Remove the letter you added (undo)","Try the next unused letter in that position"],
  cx:"O(n·n!)", cxOpts:["O(n·n!)","O(n²)","O(n log n)","O(2ⁿ)"], cxWhy:"There are n! arrangements and each costs O(n) to copy out."},

 {id:"courses", pattern:"topo", title:"Course Planner",
  text:"A university has courses with [[prerequisites]]. Find an [[order to take all courses]], or report it's impossible when there is a [[circular dependency]]. ((The registrar is strict.))",
  options:["topo","bfs","uf","dp"], trapFor:"bfs",
  trap:"Plain BFS ignores dependencies: it can schedule a course before its prerequisites.",
  why:"Topological sort orders nodes so every dependency comes first. If you can't finish all nodes, there's a cycle.",
  steps:["Count how many prerequisites each course has","Queue every course with zero prerequisites","Take a course from the queue and add it to the order","Reduce the count for courses that depend on it, queueing those that reach zero","If the order contains all courses it is valid; otherwise there is a cycle"],
  cx:"O(V + E)", cxOpts:["O(V + E)","O(V²)","O(V!)","O(E log V)"], cxWhy:"Each course and each prerequisite link is processed once."},

 {id:"islands", pattern:"dfs", title:"Island Counter",
  text:"Count the [[islands]] in a grid of ((turquoise)) water and land, where [[connected land cells]] form one island.",
  options:["dfs","bsearch","heap","dp"], trapFor:"dp",
  trap:"DP has no subproblem structure here. The task is 'find connected regions'.",
  why:"Flood fill from each unvisited land cell, marking everything reachable, counts each island exactly once.",
  steps:["Scan every cell of the grid","On unvisited land, add one to the island count","Flood out from it, marking all connected land as visited","Continue the scan; visited land is skipped"],
  cx:"O(R·C)", cxOpts:["O(R·C)","O((R·C)²)","O(R+C)","O(2^(R·C))"], cxWhy:"Each cell is visited a constant number of times."},

 {id:"autocomplete", pattern:"trie", title:"Autocomplete",
  text:"A dictionary holds 500,000 words. On every keystroke, return all words that [[start with the typed prefix]]. An exact-match lookup is ((not enough)); the app needs [[prefix queries]].",
  options:["trie","hash","stack","dp"], trapFor:"hash",
  trap:"A hash map answers 'is this exact word present?', not 'what starts with this?'.",
  why:"A trie shares common prefixes along a path, so a prefix leads you straight to the subtree of all matches.",
  steps:["For each word, walk its letters, creating tree nodes as needed","Mark the last node of each word as a word end","For a typed prefix, follow its letters down from the root","If the path breaks, there are no matches","Otherwise collect every word below that node"],
  cx:"O(L + matches)", cxOpts:["O(L + matches)","O(N·L)","O(N²)","O(L²)"], cxWhy:"Walking the prefix costs O(L) regardless of dictionary size."},

 {id:"range-sum", pattern:"prefix", title:"Sales Totals",
  text:"An array of daily sales ((for a bakery)) [[never changes]]. Answer 100,000 queries of the form [[total sales between day i and day j]].",
  options:["prefix","window","heap","bsearch"], trapFor:"window",
  trap:"Summing the range for every query is O(n) per query: up to 10 billion operations in total.",
  why:"Precompute running totals once; any range sum becomes a single subtraction.",
  steps:["Build prefix[k] as the sum of the first k days","For a query (i, j), take prefix[j+1]","Subtract prefix[i]","Return the difference as the range total"],
  cx:"O(n + q)", cxOpts:["O(n + q)","O(n·q)","O(q log n)","O(n²)"], cxWhy:"One O(n) build, then O(1) per query."},

 {id:"cycle", pattern:"fastslow", title:"Looping List",
  text:"Detect whether a [[linked list]] contains a [[cycle]] while using [[O(1) extra memory]]. ((The list stores customer names.))",
  options:["fastslow","hash","stack","bsearch"], trapFor:"hash",
  trap:"Storing visited nodes in a set works but costs O(n) memory, which is exactly what's forbidden.",
  why:"A fast runner laps a slow runner only if there's a loop, with no storage needed.",
  steps:["Start two pointers at the head","Move the slow pointer by one and the fast pointer by two","If the fast pointer reaches the end, there is no cycle","If the two pointers ever meet, there is a cycle"],
  cx:"O(n)", cxOpts:["O(n)","O(n²)","O(log n)","O(1)"], cxWhy:"The fast pointer closes the gap by one each step, so it meets the slow one within n steps."},

 {id:"fastest-route", pattern:"dijkstra", title:"Fastest Route",
  text:"Cities are linked by roads with [[different travel times]]. Find the [[fastest route]] from city A to every other city. ((A storm is forecast.)) [[No road has negative time.]]",
  options:["dijkstra","bfs","dfs","uf"], trapFor:"bfs",
  trap:"BFS counts hops, not time. A 2-hop route of 100 minutes would beat a 3-hop route of 10.",
  why:"Always expanding the closest unsettled city is correct when all costs are non-negative.",
  steps:["Set A's distance to 0 and every other city's to infinity","Put A in a min-priority queue","Pop the city with the smallest distance","For each road from it, if distance + road time improves a neighbour, update and push it","Repeat until the queue is empty"],
  cx:"O(E log V)", cxOpts:["O(E log V)","O(V + E)","O(V!)","O(E)"], cxWhy:"Each edge may cause one heap push at O(log V)."},

 {id:"warmer", pattern:"stack", title:"Next Warmer Day",
  text:"For [[each day]], find how many days until a [[warmer temperature]]. ((The data is from Lisbon.)) You want one pass over [[100,000 days]] where unresolved days [[wait for something bigger]].",
  options:["stack","window","prefix","heap"], trapFor:"window",
  trap:"A fixed-size window can't know how far ahead the next warmer day is.",
  why:"A monotonic stack holds days still waiting for a warmer one; a warmer day resolves everything colder on top.",
  steps:["Keep a stack of days still waiting for a warmer day","For each day, while the top of the stack is colder than today, pop it","Record the wait for each popped day as today minus its index","Push today onto the stack","Days left on the stack never see a warmer day"],
  cx:"O(n)", cxOpts:["O(n)","O(n²)","O(n log n)","O(log n)"], cxWhy:"Each day is pushed once and popped at most once."}
];

/* ---------- Utilities ---------- */
const $ = s => document.querySelector(s);
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const MAX_HEARTS = 6;
const KEY = "patterndojo.v1";

function loadStats(){ try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e){ return {}; } }
function saveStats(s){ try { localStorage.setItem(KEY, JSON.stringify(s)); } catch(e){} }
let stats = loadStats();           // {pattern:{n,ok}}, plus _best
function mastery(p){ const s = stats[p]; return s && s.n ? s.ok / s.n : null; }

function parse(text){
  const out = []; const re = /\[\[(.+?)\]\]|\(\((.+?)\)\)/g; let last = 0, m;
  while ((m = re.exec(text))){
    if (m.index > last) out.push({t:text.slice(last, m.index)});
    out.push(m[1] ? {t:m[1], kind:"sig"} : {t:m[2], kind:"noise"});
    last = re.lastIndex;
  }
  if (last < text.length) out.push({t:text.slice(last)});
  return out;
}

/* ---------- Game state ---------- */
let G = null;

function startRun(mode){
  let pool;
  if (mode === "weak"){
    pool = PROBLEMS.slice().sort((a,b) => {
      const ma = mastery(a.pattern), mb = mastery(b.pattern);
      return (ma === null ? -1 : ma) - (mb === null ? -1 : mb) || Math.random() - .5;
    }).slice(0, 8);
    pool = shuffle(pool);
  } else if (mode === "full") pool = shuffle(PROBLEMS);
  else pool = shuffle(PROBLEMS).slice(0, 8);
  G = {mode, queue:pool, i:0, hearts:MAX_HEARTS, score:0, streak:0, bestStreak:0, log:[], phase:0, cur:null};
  beginProblem();
}

function beginProblem(){
  const p = G.queue[G.i];
  G.phase = 0;
  G.cur = {p, tokens:parse(p.text), sel:new Set(), locked:false, wrong:0, patWrong:0, perfect:true, pts:0,
           pool:shuffle(p.steps.map((t,i)=>({t,i}))), ans:[], stepTries:0, pickedOk:false, cxWrong:0, done:false};
  G.cur.tokens.forEach((t,i)=>{ if (t.kind) t.id = i; });
  render();
}

function loseHeart(){
  G.hearts--; G.cur.perfect = false;
  if (G.hearts <= 0) { finishRun(true); return true; }
  return false;
}

function award(n){ G.cur.pts += n; G.score += n; }

function nextPhase(){ G.phase++; if (G.phase > 3) return finishProblem(); render(); }

function finishProblem(){
  const c = G.cur, p = c.p;
  const s = stats[p.pattern] || (stats[p.pattern] = {n:0, ok:0});
  s.n++; if (c.patWrong === 0) s.ok++;
  if (c.perfect){ G.streak++; G.bestStreak = Math.max(G.bestStreak, G.streak); if (G.hearts < MAX_HEARTS) G.hearts++; }
  else G.streak = 0;
  G.log.push({id:p.id, pattern:p.pattern, perfect:c.perfect, pts:c.pts});
  saveStats(stats);
  G.i++;
  if (G.i >= G.queue.length) finishRun(false); else beginProblem();
}

function finishRun(dead){
  const c = G.cur;
  if (dead && c && !G.log.find(l => l.id === c.p.id)){
    const s = stats[c.p.pattern] || (stats[c.p.pattern] = {n:0, ok:0});
    s.n++; if (c.patWrong === 0 && c.pickedOk) s.ok++;
    G.log.push({id:c.p.id, pattern:c.p.pattern, perfect:false, pts:c.pts});
  }
  if (G.score > (stats._best || 0)) stats._best = G.score;
  saveStats(stats);
  G.dead = dead; G.phase = 9;
  render();
}

/* ---------- Rendering ---------- */
function hud(){
  const hearts = "❤️".repeat(G.hearts) + "🖤".repeat(MAX_HEARTS - G.hearts);
  const dots = G.queue.map((_,i)=>{
    const l = G.log[i]; const cls = i === G.i && G.phase < 9 ? "now" : l ? (l.perfect ? "done" : "miss") : "";
    return `<i class="${cls}"></i>`;
  }).join("");
  return `<div class="hud"><span>${hearts}</span><span>Score <b>${G.score}</b></span><span>Streak <b>${G.streak}</b></span><button onclick="home()" style="padding:4px 10px">Quit</button></div><div class="dots">${dots}</div>`;
}

const PHASES = ["1 · Spot the signals","2 · Pick the pattern","3 · Set the budget","4 · Build the solution"];

function render(){
  const app = $("#app");
  if (!G) return home();
  if (G.phase === 9) return summary();
  const c = G.cur, p = c.p;
  let body = "";
  if (G.phase === 0) body = viewSignals();
  if (G.phase === 1) body = viewPattern();
  if (G.phase === 2) body = viewBudget();
  if (G.phase === 3) body = viewBuild();
  app.innerHTML = `${hud()}<div class="card"><div class="phase">${PHASES[G.phase]}</div><h2>${p.title}</h2>${body}</div>`;
}

/* Phase 0: signals */
function storyHTML(reveal){
  const c = G.cur;
  return `<div class="story">` + c.tokens.map((t,i)=>{
    if (!t.kind) return esc(t.t);
    let cls = "tok";
    if (reveal){
      const picked = c.sel.has(i);
      if (picked && t.kind === "sig") cls += " good locked";
      else if (picked && t.kind === "noise") cls += " bad locked";
      else if (!picked && t.kind === "sig") cls += " miss locked";
      else cls += " locked";
    } else if (c.sel.has(i)) cls += " sel";
    return `<span class="${cls}" ${reveal?"":`onclick="toggleTok(${i})"`}>${esc(t.t)}</span>`;
  }).join("") + `</div>`;
}
function esc(s){ return s.replace(/[&<>]/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[ch])); }

function viewSignals(){
  const c = G.cur;
  if (!c.locked){
    return `<p class="muted">Tap the phrases that tell you <i>which technique to use</i>. Some highlighted-looking phrases are just story. Wrong taps cost points.</p>
      ${storyHTML(false)}
      <div class="row" style="margin-top:14px"><button class="primary" onclick="lockSignals()">Lock in (${c.sel.size} selected)</button></div>`;
  }
  const sigs = c.tokens.filter(t=>t.kind==="sig").length;
  const good = [...c.sel].filter(i=>c.tokens[i].kind==="sig").length;
  const bad = c.sel.size - good;
  return `${storyHTML(true)}
    <p class="tag">🟢 correct signal &nbsp; 🟡 missed signal &nbsp; 🔴 story noise</p>
    <div class="fb ${bad===0&&good===sigs?"good":"warn"}"><b>${good}/${sigs} signals found${bad?`, ${bad} noise tap${bad>1?"s":""}`:""}</b> (+${c.sigPts} pts)<br><span class="muted">Real problems hide the pattern like this: read for <i>constraints and verbs</i>, ignore the story.</span></div>
    <div class="row" style="margin-top:14px"><button class="primary" onclick="nextPhase()">Choose the pattern →</button></div>`;
}
function toggleTok(i){ const c=G.cur; if (c.locked) return; c.sel.has(i) ? c.sel.delete(i) : c.sel.add(i); render(); }
function lockSignals(){
  const c = G.cur; c.locked = true;
  const good = [...c.sel].filter(i=>c.tokens[i].kind==="sig").length;
  const bad = c.sel.size - good;
  const sigs = c.tokens.filter(t=>t.kind==="sig").length;
  c.sigPts = Math.max(0, good*10 - bad*5);
  if (bad || good < sigs) c.perfect = false;
  award(c.sigPts); render();
}

/* Phase 1: pattern */
function viewPattern(){
  const c = G.cur, p = c.p;
  const opts = c.optOrder || (c.optOrder = shuffle(p.options));
  const list = opts.map(id=>{
    const P = PATTERNS[id]; let cls = "opt";
    const wrong = c.wrongSet && c.wrongSet.has(id);
    if (c.pickedOk && id === p.pattern) cls += " ok";
    if (wrong) cls += " no";
    return `<button class="${cls}" ${c.pickedOk||wrong?"disabled":""} onclick="pickPattern('${id}')"><span>${P.icon}</span><span><b>${P.name}</b></span></button>`;
  }).join("");
  let fb = c.fbPattern || "";
  const signals = c.tokens.filter(t=>t.kind==="sig").map(t=>`“${esc(t.t)}”`).join(", ");
  let next = c.pickedOk ? `<div class="row" style="margin-top:14px"><button class="primary" onclick="nextPhase()">Set the budget →</button></div>` : "";
  return `${storyHTML(true).replace(/ locked/g," locked")}<p style="margin-top:12px"><b>Which pattern solves this?</b></p><div class="opts">${list}</div>${fb}${next}`;
}
function pickPattern(id){
  const c = G.cur, p = c.p;
  c.wrongSet = c.wrongSet || new Set();
  if (id === p.pattern){
    const pts = [30,15,5][Math.min(c.patWrong,2)];
    award(pts); c.pickedOk = true;
    c.fbPattern = `<div class="fb good"><b>${PATTERNS[id].icon} ${PATTERNS[id].name}: correct (+${pts})</b><br>${p.why}<br><span class="tag">Recognition cue: ${PATTERNS[id].cue}</span></div>`;
    return render();
  }
  c.wrongSet.add(id); c.patWrong++;
  if (loseHeart()) return;
  c.fbPattern = `<div class="fb bad"><b>Not ${PATTERNS[id].name}.</b> ${id===p.trapFor ? p.trap : "Its cue is: “"+PATTERNS[id].cue+"” That doesn't match the signals in this problem."}</div>`;
  render();
}

/* Phase 2: budget */
function viewBudget(){
  const c = G.cur, p = c.p;
  const opts = c.cxOrder || (c.cxOrder = shuffle(p.cxOpts));
  const list = opts.map(o=>{
    let cls = "opt";
    if (c.done && o === p.cx) cls += " ok";
    if (c.cxWrongSet && c.cxWrongSet.has(o)) cls += " no";
    return `<button class="${cls}" ${c.done|| (c.cxWrongSet&&c.cxWrongSet.has(o))?"disabled":""} onclick="pickCx(this.dataset.v)" data-v="${esc(o)}"><b>${esc(o)}</b></button>`;
  }).join("");
  const fb = c.fbCx || "";
  const next = c.done ? `<div class="row" style="margin-top:14px"><button class="primary" onclick="nextPhase()">Build the solution →</button></div>` : "";
  return `<p>Choose the <b>tightest time complexity</b> the right pattern achieves here. Check the scale in the story: millions of items rule out anything quadratic.</p><div class="opts">${list}</div>${fb}${next}`;
}
function pickCx(v){
  const c = G.cur, p = c.p;
  if (v === p.cx){ const pts = c.cxWrong ? 5 : 15; award(pts); c.done = true;
    c.fbCx = `<div class="fb good"><b>${esc(v)} (+${pts})</b><br>${p.cxWhy}</div>`; return render(); }
  c.cxWrongSet = c.cxWrongSet || new Set(); c.cxWrongSet.add(v); c.cxWrong++;
  if (loseHeart()) return;
  c.fbCx = `<div class="fb bad"><b>${esc(v)} is not the tightest bound here.</b> Reconsider using the pattern you chose.</div>`;
  render();
}

/* Phase 3: build */
function viewBuild(){
  const c = G.cur;
  const ans = c.ans.map((s,pos)=>{
    const cls = c.checked ? (s.i === pos ? "ok" : "no") : "";
    return `<button class="step ${cls}" ${c.final?"disabled":""} onclick="unplace(${pos})"><span class="n">${pos+1}</span><span>${esc(s.t)}</span></button>`;
  }).join("") || `<p class="muted">Tap steps below to place them in order.</p>`;
  const pool = c.pool.map(s=>`<button class="step" onclick="place(${s.i})"><span class="n">+</span><span>${esc(s.t)}</span></button>`).join("");
  let fb = c.fbBuild || "";
  let actions = "";
  if (c.final) actions = `<div class="row" style="margin-top:14px"><button class="primary" onclick="nextPhase()">${G.i+1>=G.queue.length?"Finish run":"Next problem"} →</button></div>`;
  else if (!c.pool.length) actions = `<div class="row" style="margin-top:14px"><button class="primary" onclick="checkBuild()">Run it ▶</button><button onclick="resetBuild()">Reset</button></div>`;
  else actions = `<div class="row" style="margin-top:10px"><button onclick="resetBuild()">Reset</button></div>`;
  return `<p><b>You pick the right strategy: now put the steps in the correct order.</b> No code, just the logic.</p>
    <div class="tag">Your solution</div><div class="steps">${ans}</div>
    ${c.pool.length?`<div class="tag" style="margin-top:12px">Available steps</div><div class="steps">${pool}</div>`:""}
    ${fb}${actions}`;
}
function place(i){ const c=G.cur; const k=c.pool.findIndex(s=>s.i===i); if(k<0)return; c.ans.push(c.pool.splice(k,1)[0]); c.checked=false; c.fbBuild=""; render(); }
function unplace(pos){ const c=G.cur; if(c.final)return; const s=c.ans.splice(pos,1)[0]; c.pool.push(s); c.checked=false; c.fbBuild=""; render(); }
function resetBuild(){ const c=G.cur; c.pool=shuffle(c.pool.concat(c.ans)); c.ans=[]; c.checked=false; c.fbBuild=""; render(); }
function checkBuild(){
  const c = G.cur; c.checked = true;
  const right = c.ans.filter((s,pos)=>s.i===pos).length, total = c.ans.length;
  if (right === total){
    const pts = [40,20,10][Math.min(c.stepTries,2)]; award(pts); c.final = true;
    c.fbBuild = `<div class="fb good"><b>Correct order (+${pts})</b><br>That's the full algorithm, and you never wrote a line of code. Problem total: <b>${c.pts}</b> pts.</div>`;
    return render();
  }
  c.stepTries++;
  if (loseHeart()) return;
  c.fbBuild = `<div class="fb bad"><b>${right}/${total} steps in the right place.</b> Red ones are misplaced. Tap a step to pull it back out and re-place it.</div>`;
  render();
}

/* Summary */
function summary(){
  const rows = Object.keys(PATTERNS).map(id=>{
    const played = G.log.filter(l=>l.pattern===id); if (!played.length) return "";
    const ok = played.filter(l=>l.perfect).length;
    return `<div class="pat"><b>${PATTERNS[id].icon} ${PATTERNS[id].name}</b><span class="tag">${ok}/${played.length} clean this run</span></div>`;
  }).join("");
  const weak = G.log.filter(l=>!l.perfect).map(l=>PATTERNS[l.pattern].name);
  const uniqWeak = [...new Set(weak)];
  $("#app").innerHTML = `<div class="card"><div class="phase">${G.dead?"Out of focus":"Run complete"}</div>
    <div class="big">${G.score} pts</div>
    <p class="muted">${G.log.length} problems played · best streak ${G.bestStreak} · personal best ${stats._best||G.score}</p>
    ${uniqWeak.length ? `<div class="fb warn"><b>Review these:</b> ${uniqWeak.join(", ")}.<br><span class="muted">"Weak spots" mode will prioritise patterns you miss.</span></div>` : `<div class="fb good"><b>Flawless.</b> Try the full run or weak-spots mode.</div>`}
    <h2 style="margin-top:16px">This run</h2><div class="grid">${rows || "<p class='muted'>Nothing finished.</p>"}</div>
    <div class="row" style="margin-top:16px"><button class="primary" onclick="startRun('quick')">Play again</button><button onclick="startRun('weak')">Weak spots</button><button onclick="home()">Home</button></div></div>`;
}

/* Home */
function home(){
  G = null;
  const cards = Object.entries(PATTERNS).map(([id,P])=>{
    const m = mastery(id), pct = m === null ? 0 : Math.round(m*100);
    return `<div class="pat"><b>${P.icon} ${P.name}</b><span class="tag">${P.cue}</span><div class="bar"><span style="width:${pct}%"></span></div><span class="tag">${m===null?"not played yet":pct+"% first-try"}</span></div>`;
  }).join("");
  $("#app").innerHTML = `<h1>🥋 Pattern Dojo</h1>
    <p class="muted">Learn DSA by <b>recognising</b> the right approach, not by typing code. Each problem has four steps: spot the signals → pick the pattern → set the complexity budget → arrange the algorithm's steps.</p>
    <div class="card"><div class="row">
      <button class="primary" onclick="startRun('quick')">Quick run (8)</button>
      <button class="primary" onclick="startRun('full')">Full run (${PROBLEMS.length})</button>
      <button onclick="startRun('weak')">Weak spots (8)</button></div>
      <p class="tag" style="margin-top:10px">${stats._best?`Personal best: ${stats._best} pts · `:""}6 hearts. Wrong picks cost a heart; a clean problem earns one back. Progress is saved in this browser.</p></div>
    <h2>Field guide</h2><div class="grid">${cards}</div>`;
}

home();
</script>
</body>
</html>
